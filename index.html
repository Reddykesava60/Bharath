<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Weather App</h1>
      <div class="time-display" id="current-time">Loading time...</div>

      <div class="search-container">
        <input type="text" id="city-input" placeholder="Enter city name..." />
        <button id="search-btn"><i class="fas fa-search"></i> Search</button>
      </div>
    </header>

    <main>
      <section class="current-weather">
        <div class="weather-info">
          <h2 id="city-name">City Name</h2>
          <div class="temp" id="temperature">--°C</div>
          <div id="weather-desc">Weather description</div>
        </div>
        <div class="weather-icon">
          <img id="weather-icon" src="https://openweathermap.org/img/wn/10d@2x.png" alt="Weather icon" />
        </div>
      </section>

      <section class="weather-details">
        <div class="detail"><i class="fas fa-temperature-high"></i> <span>Feels Like:</span> <span id="feels-like">--°C</span></div>
        <div class="detail"><i class="fas fa-tint"></i> <span>Humidity:</span> <span id="humidity">--%</span></div>
        <div class="detail"><i class="fas fa-wind"></i> <span>Wind Speed:</span> <span id="wind-speed">-- km/h</span></div>
        <div class="detail"><i class="fas fa-compress-alt"></i> <span>Pressure:</span> <span id="pressure">-- hPa</span></div>
      </section>

      <section class="forecast">
        <h3>5-Day Forecast</h3>
        <div class="forecast-cards" id="forecast-container"></div>
      </section>
    </main>

    <footer>
      <p>Weather App &copy; <span id="year"></span> | Data provided by OpenWeatherMap</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
